name = "toggly-cloudflare-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Non-sensitive defaults. Override per-env in dashboard or .dev.vars
[vars]
TOGGLY_API_BASE_URL = "https://client.toggly.io"
TOGGLY_ENVIRONMENT = "Production"
ORIGIN_BASE_URL = "https://your-docs-origin.example.com"
TOGGLY_APP_KEY = "your-app-key"
# Metrics/usage gateway (HTTPS JSON). Defaults to https://app.toggly.io/ when unset.
TOGGLY_METRICS_BASE_URL = "https://app.toggly.io/"
# Opt-out: set to "false" to disable. Default is enabled when TOGGLY_APP_KEY is set.
# TOGGLY_USAGE_ENABLED = "true"
# TOGGLY_METRICS_ENABLED = "true"
